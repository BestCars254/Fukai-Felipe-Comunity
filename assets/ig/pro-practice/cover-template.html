<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@font-face{font-family:"NS";src:url("../fonts/node_modules/@fontsource/noto-sans-jp/files/noto-sans-jp-japanese-900-normal.woff2") format("woff2");font-weight:900}
@font-face{font-family:"NS";src:url("../fonts/node_modules/@fontsource/noto-sans-jp/files/noto-sans-jp-japanese-700-normal.woff2") format("woff2");font-weight:700}
@font-face{font-family:"BC";src:url("../fonts/node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2") format("woff2");font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#0E0B0A}
body{font-family:"NS",sans-serif;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:url(photo.jpg) 55% 30%/cover no-repeat;filter:grayscale(1) contrast(1.15);opacity:.26}
.fade{position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 50% 48%,rgba(14,11,10,0) 0%,rgba(14,11,10,.75) 70%,#0E0B0A 100%)}
.wrap{position:absolute;left:72px;right:72px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-bottom:40px}
.lbl{font-family:"BC",sans-serif;font-size:60px;letter-spacing:.3em;color:#D4A94F;margin-left:.3em}
.ep{font-family:"BC",sans-serif;font-size:360px;line-height:.85;letter-spacing:-.02em;color:#fff;margin:6px 0 30px}
.ep small{font-size:64px;letter-spacing:.3em;color:rgba(255,255,255,.7);display:block;margin-bottom:10px;font-family:"BC",sans-serif}
.bar{display:none}
.name{font-size:92px;font-weight:900;line-height:1.22;letter-spacing:-.01em}
.name.long{font-size:80px}
.sub{font-size:40px;font-weight:700;color:rgba(255,255,255,.8);margin-top:18px}
.pro{position:absolute;left:0;right:0;bottom:170px;text-align:center;font-family:"BC",sans-serif;font-size:30px;letter-spacing:.3em;color:rgba(255,255,255,.6)}
.logo{position:absolute;left:50%;transform:translateX(-50%);bottom:60px;height:84px}
.ep,.name{text-shadow:0 0 60px rgba(185,58,56,.95),0 0 120px rgba(185,58,56,.6)}
</style></head><body>
<div class="bg"></div><div class="fade"></div>
<div class="wrap">
  <p class="lbl">PRO PRACTICE</p>
  <p class="ep"><small>EPISODE</small>01</p>
  <p class="name long">プレートロード<br>インクラインプレス</p>
</div>
<p class="pro">IFBB PRO ・ FELIPE FUKAI</p>
<img class="logo" src="logo.png" alt="">
</body></html>
