# Netlify configuration for UNIÃO LP
# Deploy: drag /lp folder to https://app.netlify.com/drop
# or connect via GitHub

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify Forms auto-detects <form data-netlify="true">
# Form submissions land in: https://app.netlify.com/sites/[your-site]/forms
# Free tier: 100 submissions/month (enough for Waitlist Phase 1)

# Home: UNIÃO landing page (v3)
[[redirects]]
  from = "/"
  to = "/uniao.html"
  status = 200
  force = true

[[redirects]]
  from = "/go"
  to = "/go.html"
  status = 200

# Free lesson page (J3-style: lesson unlocks on the page after email)
[[redirects]]
  from = "/lesson"
  to = "/lesson.html"
  status = 200

[[redirects]]
  from = "/lesson/"
  to = "/lesson.html"
  status = 200

# Full UNIÃO explanation page (former top page)
[[redirects]]
  from = "/uniao"
  to = "/uniao.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/uniao.html"
  status = 301

[[redirects]]
  from = "/go/"
  to = "/go.html"
  status = 200
