<main class="go">

      <input type="hidden" name="form-name" value="uniao-waitlist" />
      <input type="hidden" name="source" value="meta-go-bentover" />
      <p class="hidden-honeypot"><label>Don't fill this out: <input name="bot-field" /></label></p>

      <button type="submit" class="cta">動画を見る</button>
    </form>

  </section>
</main>

<script>
  (function () {
    var form = document.querySelector('form.go-form');
    if (!form || !window.fetch || !window.URLSearchParams) return;
    var button = form.querySelector('button[type="submit"]');
    var original = button.innerHTML;
    var errorEl = document.createElement('p');
    errorEl.className = 'form-error';
    errorEl.setAttribute('role', 'alert');
    errorEl.hidden = true;
    button.insertAdjacentElement('afterend', errorEl);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.hidden = true;
      button.disabled = true;
      button.classList.add('is-loading');
      button.textContent = '送信中…';
      fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams(new FormData(form)).toString()
      }).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        window.location.href = '/thanks.html';
      }).catch(function () {
        button.disabled = false;
        button.classList.remove('is-loading');
        button.innerHTML = original;
        errorEl.textContent = '送信できませんでした。通信環境をご確認のうえ、もう一度お試しください。';
        errorEl.hidden = false;
      });
    });
  })();
</script>
